name: ChatGPT DAV price export FIX

on:
  push:
    branches: [chatgpt-dav-price-export]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Export corrected CSV
        run: |
          python - <<'PY'
          import csv, re, time, requests
          from bs4 import BeautifulSoup
          from concurrent.futures import ThreadPoolExecutor, as_completed

          BASE='https://medibase.vn/search/medicine-pricing/?page={}'
          HEADERS={'User-Agent':'Mozilla/5.0'}

          def get_page(page,retries=5):
              last=None
              for i in range(retries):
                  try:
                      r=requests.get(BASE.format(page),headers=HEADERS,timeout=30)
                      r.raise_for_status()
                      return r.text
                  except Exception as e:
                      last=e; time.sleep(1.5*(i+1))
              raise RuntimeError(f'page {page} failed: {last}')

          def parse_page(html):
              soup=BeautifulSoup(html,'html.parser')
              table=soup.find('table')
              if not table: raise RuntimeError('No table')
              rows=[]
              for tr in table.find_all('tr'):
                  tds=tr.find_all('td')
                  if len(tds)<5: continue
                  drug=tds[0]
                  full=' '.join(drug.stripped_strings)
                  md=re.search(r'Declared on\s*(\d{4}-\d{2}-\d{2})',full,re.I)
                  date=md.group(1) if md else ''
                  name=''
                  for sel in ['a','strong','b']:
                      el=drug.find(sel)
                      if el and el.get_text(' ',strip=True):
                          name=el.get_text(' ',strip=True); break
                  if not name:
                      ss=list(drug.stripped_strings); name=ss[0].strip() if ss else ''
                  # HTML contains an extra trailing declared-date cell; declared price is the preceding cell.
                  price_text=tds[-2].get_text(' ',strip=True)
                  digits=re.sub(r'[^0-9]','',price_text)
                  price=int(digits) if digits else ''
                  if name and price!='': rows.append([date,name,price])
              return rows,soup

          html=get_page(1)
          r1,soup=parse_page(html)
          text=soup.get_text(' ',strip=True)
          mp=re.search(r'Page\s*1\s*/\s*(\d+)',text,re.I)
          total_pages=int(mp.group(1)) if mp else 237
          pages={1:r1}
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs={ex.submit(get_page,p):p for p in range(2,total_pages+1)}
              for i,f in enumerate(as_completed(futs),1):
                  p=futs[f]; rows,_=parse_page(f.result()); pages[p]=rows
                  if i%25==0 or i==len(futs): print('done',i+1,'/',total_pages)
          rows=[]
          for p in range(1,total_pages+1): rows.extend(pages.get(p,[]))
          rows.sort(key=lambda x:(x[0],x[1],x[2]),reverse=True)
          # Sanity check: prices must not all look like YYYYMMDD dates.
          bad=sum(1 for _,_,v in rows if 20200101 <= int(v) <= 20351231)
          if bad > max(10,len(rows)*0.01):
              raise RuntimeError(f'price parse sanity failed: {bad} date-like prices')
          with open('dav_gia_ban_buon_du_kien.csv','w',newline='',encoding='utf-8-sig') as f:
              w=csv.writer(f)
              w.writerow(['Ngày cập nhật','Tên thuốc','Giá bán buôn dự kiến (VNĐ) (VAT)'])
              w.writerows(rows)
          print('rows=',len(rows),'first=',rows[:3])
          PY
      - name: Upload corrected CSV
        uses: actions/upload-artifact@v4
        with:
          name: dav-gia-ban-buon-du-kien-fixed
          path: dav_gia_ban_buon_du_kien.csv
          if-no-files-found: error
          retention-days: 1
