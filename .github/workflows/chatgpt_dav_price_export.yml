name: ChatGPT DAV price export

on:
  push:
    branches: [chatgpt-dav-price-export]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Diagnose pricing table
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          html=requests.get('https://medibase.vn/search/medicine-pricing/?page=1',headers={'User-Agent':'Mozilla/5.0'},timeout=30).text
          soup=BeautifulSoup(html,'html.parser')
          table=soup.find('table')
          for tr in table.find_all('tr')[1:3]:
              tds=tr.find_all('td')
              print('TD COUNT',len(tds))
              for i,td in enumerate(tds):
                  print('TD',i,repr(' | '.join(td.stripped_strings)))
          PY
