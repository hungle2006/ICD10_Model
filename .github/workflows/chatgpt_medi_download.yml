name: ChatGPT MEDI mapping download

on:
  push:
    branches: [chatgpt-medi-full-map]
    paths:
      - '.github/workflows/chatgpt_medi_download.yml'
  workflow_dispatch:

jobs:
  download-medi:
    runs-on: ubuntu-latest
    steps:
      - name: Download MEDI-Combined
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import urllib.request
          url = 'https://wei-lab.app.vumc.org/assets/resources/MEDI_Combined.csv'
          dst = 'out/MEDI_Combined.csv'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=120) as r, open(dst,'wb') as f:
              while True:
                  chunk = r.read(1024*1024)
                  if not chunk:
                      break
                  f.write(chunk)
          print('downloaded', dst)
          PY
          python - <<'PY'
          import csv, os, collections
          p='out/MEDI_Combined.csv'
          vocab=collections.Counter(); hps=collections.Counter(); n=0
          with open(p, encoding='utf-8-sig', newline='') as f:
              reader=csv.DictReader(f)
              print('columns=', reader.fieldnames)
              for row in reader:
                  n += 1
                  vocab[row.get('VOCABULARY','')] += 1
                  hps[row.get('HIGH_PRECISION_SUBSET','')] += 1
          print('rows=', n)
          print('vocabulary=', dict(vocab))
          print('hps=', dict(hps))
          print('bytes=', os.path.getsize(p))
          PY

      - name: Upload MEDI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEDI-Combined-full
          path: out/MEDI_Combined.csv
          retention-days: 1
